<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./javascript.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/style.css">
  <title>Solar System</title>
</head>

<body>
  <script type="module" src="/src/main.js"></script>
  <div id="information-box-container">
  </div>
  <section id="speed-control" aria-label="Animation speed controls">
    <label for="speed-slider">Simulation speed <output id="speed-value" for="speed-slider">1.0×</output></label>
    <input id="speed-slider" type="range" min="0" max="4" step="0.1" value="1">
    <div class="camera-controls" role="group" aria-label="Camera controls">
      <button id="orbit-mode" type="button" aria-pressed="true">Orbit</button>
      <button id="fly-mode" type="button" aria-pressed="false">Fly</button>
    </div>
    <p id="fly-help" hidden>WASD move · R/F up/down · drag to look</p>
  </section>
</body>

</html>
